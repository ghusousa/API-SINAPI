[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sinapi-client"
version = "1.0.0"
description = "Cliente Python para a API SINAPI do Orçamentador (www.orcamentador.com.br)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/ghusousa/API-SINAPI"
Documentation = "https://www.orcamentador.com.br/api/docs"

[tool.setuptools.packages.find]
include = ["sinapi_client*"]
